# Run "Check" (development_roadmap.md Section 2.3): the one command on every change.
# A missing tool is a failure here (--strict). The result of this run is the one that counts.
name: Check

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          # A cache of its own: the run "Build" saves a cache without ktlint and detekt under the
          # same files of the build, so this run would download both every time (TK-013).
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
            gradle/libs.versions.toml
            .github/workflows/check.yml

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Python tools of the checks
        run: python -m pip install -r checks/requirements-ci.txt -r toolkit/requirements.txt -r setup/requirements.txt

      - name: Cache of the stem model of the Toolkit
        uses: actions/cache@v6.1.0
        with:
          path: build/models
          key: htdemucs-d05c269d0178d2a72ad484b10b11dd370193fc923201c3b27a99f848745db70a

      - name: Stem model of the Toolkit, with its checksum
        run: python toolkit/fetch_model.py build/models

      - name: Versions of the tools
        run: |
          java -version 2>&1 | head -1
          cmake --version | head -1
          clang++ --version | head -1
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: The one command
        run: python checks/one_command.py --strict
