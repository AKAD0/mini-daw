<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workspace with Channel Rack</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{background:none;border:0;padding:0;margin:0;color:inherit;font:inherit;cursor:pointer}
a{color:#4FC3F7;text-decoration:none}a:hover{color:#81D4FA}
</style>
</helmet>
<div style="width: 931px; height: 451px; box-sizing: border-box; padding: 20px; background: #08090A; border-radius: 40px; font-family: Inter, system-ui, sans-serif; color: #E6E8EB">
<div style="width: 891px; height: 411px; border-radius: 20px; overflow: hidden; display: flex; background: #101214">

<div style="width: 38px; height: 411px; background: #000000; display: flex; align-items: center; justify-content: center">
<div style="width: 11px; height: 11px; border-radius: 50%; background: #15171A; box-shadow: 0 0 0 2px #0A0B0C"></div>
</div>

<div style="width: 853px; height: 411px; display: flex; flex-direction: column">

<div style="height: 44px; display: flex; align-items: stretch; background: #1B1E22; border-bottom: 1px solid #2A2F36; box-sizing: border-box">
<button aria-label="{{playLabel}}" onClick="{{togglePlay}}" style="width: 48px; display: flex; align-items: center; justify-content: center">
<sc-if value="{{stopped}}" hint-placeholder-val="{{true}}"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z" fill="#E6E8EB"></path></svg></sc-if>
<sc-if value="{{playing}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v10H7z" fill="#4FC3F7"></path></svg></sc-if>
</button>
<button aria-label="Record" style="width: 48px; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6.5" fill="#EF5350"></circle></svg>
</button>
<button aria-label="Mode: Pattern" style="width: 76px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #4FC3F7">PAT</button>
<div style="width: 72px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums">1.3.1</div>
<button aria-label="Tempo 120 BPM" style="width: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1">
<span style="font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums">120</span>
<span style="font-size: 11px; color: #9AA3AD">BPM</span>
</button>
<button aria-label="Metronome" style="width: 44px; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9AA3AD" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6l3.5 18h-13z"></path><path d="M12 16l5-8"></path></svg>
</button>
<button aria-label="Project menu" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 13px; color: #E6E8EB">
<span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">Untitled 1</span>
<span style="font-size: 11px; color: #9AA3AD">▾</span>
</button>
<button aria-label="Undo" style="width: 44px; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E6E8EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h10a6 6 0 0 1 0 12h-3"></path></svg>
</button>
<button aria-label="Redo" style="width: 44px; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5C646E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l5-5-5-5"></path><path d="M20 9H10a6 6 0 0 0 0 12h3"></path></svg>
</button>
<button aria-label="Swap the panels" style="width: 44px; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E6E8EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h15l-3-3"></path><path d="M20 16H5l3 3"></path></svg>
</button>
<a href="Mixer.dc.html" aria-label="Open the Mixer" style="width: 48px; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E6E8EB" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 4v16"></path><path d="M12 4v16"></path><path d="M18 4v16"></path><path d="M3.5 14h5"></path><path d="M9.5 8h5"></path><path d="M15.5 12h5"></path></svg>
</a>
<button aria-label="Menu" style="width: 44px; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E6E8EB" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h16"></path></svg>
</button>
</div>

<div style="height: 367px; display: flex">

<div style="width: 463px; display: flex; flex-direction: column; background: #1B1E22">
<div style="height: 40px; display: flex; border-bottom: 1px solid #2A2F36; box-sizing: border-box">
<button aria-label="Playlist menu, grid 1/4" style="width: 88px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; border-right: 1px solid #2A2F36; box-sizing: border-box">1/4 <span style="font-size: 11px; color: #9AA3AD">▾</span></button>
<div style="width: 375px; position: relative; overflow: hidden; background: #1B1E22">
<sc-for list="{{ruler}}" as="r" hint-placeholder-count="16">
<div style="position: absolute; left: {{r.x}}px; bottom: 0; width: 1px; height: {{r.h}}px; background: #3A414B"></div>
</sc-for>
<sc-for list="{{bars}}" as="b" hint-placeholder-count="4">
<div style="position: absolute; left: {{b.x}}px; top: 7px; font-size: 12px; color: #9AA3AD; font-variant-numeric: tabular-nums">{{b.label}}</div>
</sc-for>
<div style="position: absolute; left: 42px; top: 0; width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 9px solid #4FC3F7"></div>
<div style="position: absolute; left: 47px; top: 8px; bottom: 0; width: 2px; background: #4FC3F7"></div>
</div>
</div>
<div style="height: 327px; display: flex">
<div style="width: 88px; border-right: 1px solid #2A2F36; box-sizing: border-box">
<sc-for list="{{tracks}}" as="t" hint-placeholder-count="8">
<div style="height: 40px; box-sizing: border-box; border-bottom: 1px solid #2A2F36; display: flex; align-items: center; background: {{t.bg}}">
<div style="width: 4px; height: 100%; background: {{t.color}}"></div>
<div style="flex: 1; min-width: 0; padding-left: 6px; display: flex; flex-direction: column; line-height: 1.15">
<span style="font-size: 12px; font-weight: 500; color: {{t.nameColor}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.name}}</span>
<span style="font-size: 11px; color: #9AA3AD; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.ch}}</span>
</div>
<button aria-label="{{t.muteLabel}}" style="width: 30px; height: 40px; display: flex; align-items: center; justify-content: center">
<sc-if value="{{t.audible}}" hint-placeholder-val="{{true}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9AA3AD" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"></path><path d="M16.5 9a4 4 0 0 1 0 6"></path></svg></sc-if>
<sc-if value="{{t.muted}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFB300" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"></path><path d="M16 9l5 6"></path><path d="M21 9l-5 6"></path></svg></sc-if>
</button>
</div>
</sc-for>
</div>
<div style="width: 375px; position: relative; overflow: hidden; background: #181B1F">
<sc-for list="{{laneLines}}" as="g" hint-placeholder-count="16">
<div style="position: absolute; left: {{g.x}}px; top: 0; bottom: 0; width: 1px; background: {{g.color}}"></div>
</sc-for>
<sc-for list="{{rows}}" as="w" hint-placeholder-count="8">
<div style="position: absolute; left: 0; right: 0; top: {{w.y}}px; height: 1px; background: #2A2F36"></div>
</sc-for>
<sc-for list="{{clips}}" as="c" hint-placeholder-count="10">
<div style="position: absolute; left: {{c.x}}px; top: {{c.y}}px; width: {{c.w}}px; height: 32px; border-radius: 5px; background: {{c.color}}; opacity: {{c.opacity}}; box-sizing: border-box; {{c.ring}}">
<div style="position: absolute; left: 6px; top: 2px; right: 4px; font-size: 11px; font-weight: 600; color: #101214; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.name}}</div>
<div style="position: absolute; left: 4px; right: 4px; top: 15px; bottom: 3px; display: flex; align-items: center; gap: 1px; overflow: hidden">
<sc-for list="{{c.wave}}" as="v" hint-placeholder-count="0">
<div style="width: 2px; flex: none; height: {{v.h}}px; background: rgba(16, 18, 20, 0.45); border-radius: 1px"></div>
</sc-for>
</div>
<sc-if value="{{c.selected}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: -5px; top: 6px; width: 8px; height: 20px; border-radius: 3px; background: #E6E8EB; box-shadow: 0 0 0 2px #4FC3F7"></div>
<div style="position: absolute; right: -5px; top: 6px; width: 8px; height: 20px; border-radius: 3px; background: #E6E8EB; box-shadow: 0 0 0 2px #4FC3F7"></div>
</sc-if>
</div>
</sc-for>
<div style="position: absolute; left: 47px; top: 0; bottom: 0; width: 2px; background: #4FC3F7"></div>
</div>
</div>
</div>

<div style="width: 12px; background: #101214; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
<div style="width: 4px; height: 4px; border-radius: 50%; background: #5C646E"></div>
<div style="width: 4px; height: 4px; border-radius: 50%; background: #5C646E"></div>
<div style="width: 4px; height: 4px; border-radius: 50%; background: #5C646E"></div>
</div>

<div style="width: 378px; display: flex; background: #1B1E22">
<div style="width: 334px; display: flex; flex-direction: column">
<div style="height: 40px; display: flex; align-items: center; gap: 4px; padding: 0 6px; border-bottom: 1px solid #2A2F36; box-sizing: border-box">
<button aria-label="Pattern Beat A, open the list of Patterns" style="height: 32px; padding: 0 10px; border-radius: 6px; background: #262A30; display: flex; align-items: center; gap: 6px; font-size: 13px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #E8735A"></span>Beat A <span style="font-size: 11px; color: #9AA3AD">▾</span></button>
<div style="flex: 1"></div>
<button aria-label="More: length and all instruments" style="width: 40px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #E6E8EB">⋯</button>
</div>
<sc-for list="{{parts}}" as="p" hint-placeholder-count="4">
<div style="height: 44px; display: flex; align-items: center; border-bottom: 1px solid #24282E; box-sizing: border-box">
<button aria-label="Mute {{p.name}}" style="width: 36px; height: 44px; display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9AA3AD" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"></path><path d="M16.5 9a4 4 0 0 1 0 6"></path></svg>
</button>
<div style="width: 56px; display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; overflow: hidden">
<span style="width: 8px; height: 8px; flex: none; border-radius: 50%; background: {{p.color}}"></span>
<span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.name}}</span>
</div>
<div style="display: flex">
<sc-for list="{{p.steps}}" as="s" hint-placeholder-count="8">
<button aria-label="{{s.label}}" aria-pressed="{{s.pressed}}" style="width: 30px; height: 44px; display: flex; align-items: center; justify-content: center">
<span style="width: 26px; height: 36px; border-radius: 5px; background: {{s.bg}}; box-sizing: border-box; border: 1px solid {{s.edge}}"></span>
</button>
</sc-for>
</div>
</div>
</sc-for>
<button aria-label="Add Part" style="height: 44px; display: flex; align-items: center; gap: 8px; padding-left: 12px; font-size: 13px; color: #9AA3AD; border-bottom: 1px solid #24282E; box-sizing: border-box; text-align: left">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9AA3AD" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
Add Part
</button>
<div style="flex: 1"></div>
<div style="height: 44px; display: flex; align-items: center; justify-content: center; gap: 12px; border-top: 1px solid #2A2F36; box-sizing: border-box">
<button aria-label="Previous Steps" style="width: 44px; height: 40px; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5C646E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</button>
<span style="font-size: 12px; color: #9AA3AD; font-variant-numeric: tabular-nums">Steps 1–8 of 16</span>
<button aria-label="Next Steps" style="width: 44px; height: 40px; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E6E8EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</button>
</div>
</div>

<div style="width: 44px; border-left: 1px solid #2A2F36; box-sizing: border-box; display: flex; flex-direction: column">
<sc-for list="{{modules}}" as="m" hint-placeholder-count="5">
<sc-if value="{{m.isLink}}" hint-placeholder-val="{{true}}">
<a href="{{m.href}}" aria-label="{{m.label}}" style="width: 43px; height: 44px; display: flex; align-items: center; justify-content: center; background: {{m.bg}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{m.fg}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.d}}"></path></svg>
</a>
</sc-if>
<sc-if value="{{m.isButton}}" hint-placeholder-val="{{false}}">
<button aria-label="{{m.label}}" style="width: 43px; height: 44px; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{m.fg}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.d}}"></path></svg>
</button>
</sc-if>
</sc-for>
</div>
</div>

</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":931,"height":451}}'>
class Component extends DCLogic {
  renderVals() {
    const playing = !!(this.state && this.state.playing);
    const C = ['#E8735A', '#E0A030', '#C9C24A', '#6CC070', '#3FB8A8', '#4AA3DF', '#6E7FE8', '#A178E0', '#D66BC2', '#E0607E', '#9C8F7A', '#7FA0B0'];
    const trackDefs = [
      { name: 'Drums', ch: 'Drums', c: 0, selected: true },
      { name: 'Bass', ch: 'Bass', c: 1 },
      { name: 'Keys', ch: 'Keys', c: 5 },
      { name: 'Vocal', ch: 'Vocal', c: 9 },
      { name: 'Guitar', ch: 'Guitar', c: 3 },
      { name: 'Pad', ch: 'Pad', c: 7, muted: true },
      { name: 'Riser', ch: 'FX', c: 4 },
      { name: 'Shaker', ch: 'Drums', c: 2 }
    ];
    const tracks = trackDefs.map((t) => ({
      name: t.name,
      ch: t.ch,
      color: C[t.c],
      muted: !!t.muted,
      audible: !t.muted,
      muteLabel: (t.muted ? 'Unmute ' : 'Mute ') + t.name,
      bg: t.selected ? '#262A30' : '#1B1E22',
      nameColor: t.muted ? '#9AA3AD' : '#E6E8EB'
    }));
    const clipDefs = [
      [0, 'Beat A', 0, 8, false], [0, 'Beat B', 8, 8, false],
      [1, 'Bass 1', 0, 16, false],
      [2, 'Hummed 1', 4, 8, false],
      [3, 'Take 3', 6, 9, true],
      [4, 'Riff', 8, 6, true],
      [5, 'Pad', 0, 16, false],
      [6, 'Riser', 12, 4, true],
      [7, 'Shaker', 4, 4, false], [7, 'Shaker', 12, 4, false]
    ];
    const clips = clipDefs.map(([t, name, s, l, audio]) => {
      const w = l * 24 - 2;
      const wave = [];
      if (audio) {
        const n = Math.floor((w - 8) / 3);
        for (let i = 0; i < n; i++) {
          wave.push({ h: Math.round(3 + Math.abs(Math.sin(i * 0.9 + s) * Math.cos(i * 0.31 + t)) * 11) });
        }
      }
      const selected = t === 0 && s === 0;
      return {
        name, x: s * 24 + 1, y: t * 40 + 4, w, color: C[trackDefs[t].c],
        opacity: trackDefs[t].muted ? 0.38 : 1, wave, selected,
        ring: selected ? 'box-shadow: 0 0 0 2px #4FC3F7;' : ''
      };
    });
    const ruler = [];
    const laneLines = [];
    const bars = [];
    for (let i = 0; i < 16; i++) {
      ruler.push({ x: i * 24, h: i % 4 === 0 ? 14 : 5 });
      laneLines.push({ x: i * 24, color: i % 4 === 0 ? '#3A414B' : '#252A30' });
      if (i % 4 === 0) bars.push({ x: i * 24 + 4, label: String(i / 4 + 1) });
    }
    const rows = [];
    for (let i = 1; i <= 8; i++) rows.push({ y: i * 40 - 1 });
    const partDefs = [
      { name: 'Kick', c: 0, on: [1, 0, 0, 0, 1, 0, 0, 0] },
      { name: 'Snare', c: 9, on: [0, 0, 1, 0, 0, 0, 1, 0] },
      { name: 'Hat', c: 2, on: [1, 0, 1, 0, 1, 0, 1, 1] },
      { name: 'Clap', c: 3, on: [0, 0, 0, 0, 0, 0, 1, 0] }
    ];
    const parts = partDefs.map((p) => ({
      name: p.name,
      color: C[p.c],
      steps: p.on.map((v, i) => ({
        label: p.name + ', Step ' + (i + 1),
        pressed: v ? 'true' : 'false',
        bg: v ? C[p.c] : (i < 4 ? '#262A30' : '#30353D'),
        edge: v ? C[p.c] : (i < 4 ? '#2E333A' : '#394049')
      }))
    }));
    const modules = [
      { label: 'Piano roll', href: 'Main.dc.html', active: false, d: 'M3 5h18v14H3z M7 9h5 M10 12.5h6 M6 16h4' },
      { label: 'Channel Rack', href: 'Rack.dc.html', active: true, d: 'M3.5 6.5h4v4h-4z M10 6.5h4v4h-4z M16.5 6.5h4v4h-4z M3.5 13.5h4v4h-4z M10 13.5h4v4h-4z M16.5 13.5h4v4h-4z' },
      { label: 'Sample browser', href: '', active: false, d: 'M3 6h7l2 2h9v11H3z' },
      { label: 'Recorder', href: '', active: false, d: 'M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z M5.5 11a6.5 6.5 0 0 0 13 0 M12 17.5V21' },
      { label: 'Effect editor', href: '', active: false, d: 'M21 12a9 9 0 1 1-18 0a9 9 0 1 1 18 0z M12 12l4.5-4.5' }
    ].map((m) => ({
      label: m.label, href: m.href, d: m.d, isLink: !!m.href, isButton: !m.href,
      bg: m.active ? 'rgba(79, 195, 247, 0.16)' : 'transparent', fg: m.active ? '#4FC3F7' : '#9AA3AD'
    }));
    return {
      playing, stopped: !playing, playLabel: playing ? 'Stop' : 'Play',
      togglePlay: () => this.setState({ playing: !playing }),
      tracks, clips, ruler, laneLines, bars, rows, parts, modules
    };
  }
}
</script>
</body>
</html>
