# Versions of the build (technology_stack.md Section 3.3). Every entry has a row in checks/licences.toml.
[versions]
agp = "8.13.2"
kotlin = "2.2.21"
compileSdk = "36"
targetSdk = "36"
minSdk = "31"
# The NDK and the CMake of the Android SDK on the runner of the CI service (TK-005). The NDK r28 and
# later align native code for pages of 16 KB by default (CON-11).
ndk = "29.0.14206865"
cmake = "3.31.5"
oboe = "1.10.0"
# Unit tests of the Kotlin modules on the JVM (TK-007). JUnit 5 is EPL-2.0: test use only (D-115).
junit = "5.13.4"
# ONNX Runtime for the candidate SwiftF0 of V-05, in the test build only (TK-010)
onnxruntime = "1.31.1"
ktlint = "1.8.0"
detekt = "1.23.8"
# The state of ProjectSession as a StateFlow (TK-017, technology_stack.md Section 1: Kotlin coroutines).
kotlinxCoroutines = "1.10.2"
composeBom = "2025.10.01"
activityCompose = "1.11.0"
profileinstaller = "1.4.1"

[libraries]
ktlint-cli = { module = "com.pinterest.ktlint:ktlint-cli", version.ref = "ktlint" }
detekt-cli = { module = "io.gitlab.arturbosch.detekt:detekt-cli", version.ref = "detekt" }
oboe = { module = "com.google.oboe:oboe", version.ref = "oboe" }
onnxruntime-android = { module = "com.microsoft.onnxruntime:onnxruntime-android", version.ref = "onnxruntime" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
# The apps for the check V-02 (checkapps/). D-041 decides later whether the product uses Compose.
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
