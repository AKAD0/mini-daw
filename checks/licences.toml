# List of licences (NFR-LEG-01, D-024). checks/check_licences.py compares it with the files of the build.
# Every library, plugin, native library, Python package and action that a file of the build declares
# has one entry. A "tool" is a program of the CI service or of the host; nothing declares its version.
# Fields:
#   name     coordinate, ID of a plugin, name in FetchContent_Declare, Python package or action
#   kind     library | plugin | native | python | action | tool | model (a model file, by its path)
#            | data (a public set of analysis/tools/datasets.toml, for tests only)
#   licence  SPDX identifier; it must be one of D-024
#   use      app (inside the app package) | build | test | toolkit (inside the Sandbox)
#   source   where the licence was read

# --- Gradle build
[[entry]]
name = "gradle"
kind = "tool"
licence = "Apache-2.0"
use = "build"
source = "github.com/gradle/gradle, read on 2026-11-21"

