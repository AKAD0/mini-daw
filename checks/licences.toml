# List of licences (NFR-LEG-01, D-024). checks/check_licences.py compares it with the files of the build.
# Every library, plugin, native library, Python package and action that a file of the build declares
# has one entry. A "tool" is a program of the CI service or of the host; nothing declares its version.
# Fields:
#   name     coordinate, ID of a plugin, name in FetchContent_Declare, Python package or action
#   kind     library | plugin | native | python | action | tool
#   licence  SPDX identifier; it must be one of D-024
#   use      app (inside the app package) | build | test | toolkit (inside the Sandbox)
#   source   where the licence was read

# --- Gradle build
[[entry]]
name = "gradle"
kind = "tool"
licence = "Apache-2.0"
use = "build"
source = "github.com/gradle/gradle, read on 2026-11-21"

[[entry]]
name = "com.android.application"
kind = "plugin"
licence = "Apache-2.0"
use = "build"
source = "Android Gradle Plugin, Android Open Source Project"

[[entry]]
name = "com.android.library"
kind = "plugin"
licence = "Apache-2.0"
use = "build"
source = "Android Gradle Plugin, Android Open Source Project"

[[entry]]
name = "com.android.test"
kind = "plugin"
licence = "Apache-2.0"
use = "build"
source = "Android Gradle Plugin, Android Open Source Project"

[[entry]]
name = "org.jetbrains.kotlin.android"
kind = "plugin"
licence = "Apache-2.0"
use = "build"
source = "github.com/JetBrains/kotlin, file license/LICENSE.txt"

[[entry]]
name = "org.jetbrains.kotlin.jvm"
kind = "plugin"
licence = "Apache-2.0"
use = "build"
source = "github.com/JetBrains/kotlin, file license/LICENSE.txt"

[[entry]]
name = "com.pinterest.ktlint:ktlint-cli"
kind = "library"
licence = "MIT"
use = "build"
source = "github.com/pinterest/ktlint, read on 2026-11-21"

[[entry]]
name = "io.gitlab.arturbosch.detekt:detekt-cli"
kind = "library"
licence = "Apache-2.0"
use = "build"
source = "github.com/detekt/detekt, read on 2026-11-21"

# --- Native code
[[entry]]
name = "googletest"
kind = "native"
licence = "BSD-3-Clause"
use = "test"
source = "github.com/google/googletest, read on 2026-11-21"

# --- Python tools
[[entry]]
